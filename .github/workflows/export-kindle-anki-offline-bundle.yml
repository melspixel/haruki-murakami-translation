name: Export Kindle Anki offline bundle

on:
  workflow_dispatch:
  push:
    branches: [kindle-anki-offline-bundle]
    paths:
      - '.github/workflows/export-kindle-anki-offline-bundle.yml'

permissions:
  contents: read

env:
  ANKI_COMMIT: e5a6fbe27fdd4d57d5f712191b4a753032e57853
  RUST_TOOLCHAIN: '1.92.0'
  KOX_TAG: '2025.05'

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install export dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl zstd protobuf-compiler

      - name: Fetch exact Anki source and translation submodules
        run: |
          set -euo pipefail
          git init /tmp/anki
          git -C /tmp/anki remote add origin https://github.com/ankitects/anki.git
          git -C /tmp/anki fetch --depth 1 origin "$ANKI_COMMIT"
          git -C /tmp/anki checkout --detach FETCH_HEAD
          test "$(git -C /tmp/anki rev-parse HEAD)" = "$ANKI_COMMIT"
          git -C /tmp/anki submodule update --init --recursive --depth 1
          rm -rf /tmp/anki/.git /tmp/anki/ftl/core-repo/.git /tmp/anki/ftl/qt-repo/.git

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          targets: armv7-unknown-linux-gnueabihf

      - name: Vendor all Cargo dependencies
        working-directory: /tmp/anki
        run: |
          set -euo pipefail
          mkdir -p /tmp/offline/vendor /tmp/offline/cargo
          cargo vendor --locked --versioned-dirs /tmp/offline/vendor > /tmp/offline/cargo/config.toml
          cargo metadata --locked --offline --format-version 1 >/tmp/offline/cargo-metadata.json

      - name: Download pinned KindleHF toolchain archive
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            "https://github.com/koreader/koxtoolchain/releases/download/${KOX_TAG}/kindlehf.tar.gz" \
            -o /tmp/offline/kindlehf-${KOX_TAG}.tar.gz

      - name: Package Rust and protoc runtimes
        run: |
          set -euo pipefail
          TOOLCHAIN_DIR=$(dirname "$(dirname "$(rustup which rustc --toolchain ${RUST_TOOLCHAIN})")")
          mkdir -p /tmp/offline/protoc/bin /tmp/offline/protoc/lib
          cp /usr/bin/protoc /tmp/offline/protoc/bin/
          ldd /usr/bin/protoc | awk '/=> \/|^\// {for (i=1;i<=NF;i++) if ($i ~ /^\//) print $i}' | sort -u | while read -r lib; do cp -L "$lib" /tmp/offline/protoc/lib/; done
          printf '%s\n' "$TOOLCHAIN_DIR" >/tmp/offline/rust-toolchain-source.txt
          tar --zstd -C "$(dirname "$TOOLCHAIN_DIR")" -cf /tmp/offline/rust-${RUST_TOOLCHAIN}-x86_64-with-armv7.tar.zst "$(basename "$TOOLCHAIN_DIR")"
          tar --zstd -C /tmp/offline -cf /tmp/offline/protoc-runtime-ubuntu24.tar.zst protoc

      - name: Package source and vendor tree
        run: |
          set -euo pipefail
          tar --zstd -C /tmp -cf /tmp/offline/anki-${ANKI_COMMIT}-source.tar.zst anki
          tar --zstd -C /tmp/offline -cf /tmp/offline/cargo-vendor-anki-${ANKI_COMMIT}.tar.zst vendor cargo cargo-metadata.json
          cd /tmp/offline
          sha256sum \
            anki-${ANKI_COMMIT}-source.tar.zst \
            cargo-vendor-anki-${ANKI_COMMIT}.tar.zst \
            rust-${RUST_TOOLCHAIN}-x86_64-with-armv7.tar.zst \
            kindlehf-${KOX_TAG}.tar.gz \
            protoc-runtime-ubuntu24.tar.zst > MANIFEST.sha256
          du -h ./*
          sha256sum -c MANIFEST.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Kindle-Anki-offline-build-bundle
          path: |
            /tmp/offline/anki-*-source.tar.zst
            /tmp/offline/cargo-vendor-anki-*.tar.zst
            /tmp/offline/rust-*-x86_64-with-armv7.tar.zst
            /tmp/offline/kindlehf-*.tar.gz
            /tmp/offline/protoc-runtime-ubuntu24.tar.zst
            /tmp/offline/MANIFEST.sha256
            /tmp/offline/rust-toolchain-source.txt
          retention-days: 30
          compression-level: 0
